    --blue: #2e86c8;
    --green: #35943f;
    --grape: #7b4fa0;

    --ring-1: #f7c51e;
    --ring-2: #f0812a;
    --ring-3: #e23a2e;
    --ring-4: #2e86c8;

    --card: #fff6e0;
    --card-2: #ffeec9;
    --text: #17110e;
    --title: #e23a2e;
    --title-shadow: #f7c51e;
    --subtitle: #1b6ca8;

    --cell-border: #b9a687;
    --cell-border-filled: var(--ink);
    --cell-bg: #fffdf4;
    --cell-text: #17110e;

    --key-bg: #ffe9b0;
    --key-bg-hover: #ffdc8a;
    --key-text: #17110e;

    --correct: #35943f;
    --present: #f7c51e;
    --absent: #7c6f64;
    --on-correct: #ffffff;
    --on-present: #17110e;
    --on-absent: #ffffff;

    --line: 3px;
    --hard: rgba(23, 17, 14, 0.9);
    --modal-overlay: rgba(23, 17, 14, 0.55);
    --modal-bg: #fff6e0;
    --bar-bg: #f2dfb4;
    --icon-hover: rgba(226, 58, 46, 0.14);
    --chip-bg: #ffe9b0;
    --panel: rgba(23, 17, 14, 0.86);
  }

  :root[data-theme="dark"] {
    /* ---- Midnight desert: same cartoon, after the last showing ---- */
    --ink: #05070c;
    --red: #ef5a4c;
    --orange: #f0913f;
    --yellow: #f8cf3c;
    --blue: #4aa3e0;
    --green: #4aa855;

    --ring-1: #2c2a17;
    --ring-2: #33220f;
    --ring-3: #331317;
    --ring-4: #0f2035;

    --card: #17233a;
    --card-2: #121c2f;
    --text: #ffeecd;
    --title: #f8cf3c;
    --title-shadow: #e23a2e;
    --subtitle: #7cc0ef;

    --cell-border: #3d4d69;
    --cell-border-filled: #ffeecd;
    --cell-bg: #101a2b;
    --cell-text: #ffeecd;

    --key-bg: #253550;
    --key-bg-hover: #2f4364;
    --key-text: #ffeecd;

    --correct: #3f9a4a;
    --present: #d9ac1d;
    --absent: #46505f;
    --on-correct: #ffffff;
    --on-present: #17110e;
    --on-absent: #e9dcc4;

    --hard: rgba(0, 0, 0, 0.85);
    --modal-overlay: rgba(3, 6, 12, 0.7);
    --modal-bg: #17233a;
    --bar-bg: #253550;
    --icon-hover: rgba(248, 207, 60, 0.16);
    --chip-bg: #253550;
    --panel: rgba(5, 10, 20, 0.9);
  }
  * { box-sizing: border-box; }
  /* An author `display` rule beats the UA stylesheet's [hidden] rule, so make
     the attribute authoritative — #distribution is display:flex. */
  [hidden] { display: none !important; }
  html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; min-height: 100vh; min-height: 100dvh; }

  body {
    /* Vertical scroll stays available as a safety net on short screens;
       horizontal scroll is suppressed above. */
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-weight: 700;
    background-color: var(--ring-1);
    background-image: repeating-radial-gradient(
      circle at 50% 40%,
      var(--ring-1) 0 5.4vmax,
      var(--ring-2) 5.4vmax 10.8vmax,
      var(--ring-3) 10.8vmax 16.2vmax,
      var(--ring-4) 16.2vmax 21.6vmax
    );
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .prop-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .game {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 760px;
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: var(--line) solid var(--ink);
    border-radius: 22px;
    padding: 20px 24px 20px;
    box-shadow: 8px 9px 0 var(--hard);
    text-align: center;
    /* Kills accidental double-tap zoom while tapping out a word. Pinch zoom
       still works, so this doesn't cost anyone their zoom. */
    touch-action: manipulation;
  }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .topbar h1 {
    flex: 1 1 260px;
    text-align: center;
    margin: 0 0 2px;
    font-family: 'Luckiest Guy', 'Impact', 'Haettenschweiler', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: clamp(27px, 4.6vw, 54px);
    line-height: 1.08;
    letter-spacing: 1px;
    color: var(--title);
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 3px 3px 0 var(--title-shadow), 5px 5px 0 var(--ink);
  }
  .action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pill-btn, .pill-ghost {
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    padding: 9px 17px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    touch-action: manipulation;
    box-shadow: 3px 3px 0 var(--hard);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
  }
  .pill-btn { background: var(--red); color: #fff; }
  .pill-ghost { background: var(--yellow); color: var(--ink); }
  .pill-btn:hover { background: #cf3125; }
  .pill-ghost:hover { background: #ffd84f; }
  .pill-btn:active, .pill-ghost:active, .icon-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--hard);
  }
  .pill-btn svg, .pill-ghost svg { display: block; }

  .icon-btn {
    width: 42px;
    height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--blue);
    border: var(--line) solid var(--ink);
    color: #fff;
    cursor: pointer;
    padding: 0;
    border-radius: 50%;
    touch-action: manipulation;
    box-shadow: 3px 3px 0 var(--hard);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
    font-family: inherit;
  }
  .icon-btn:hover { background: #1b6ca8; }
  .icon-btn svg { display: block; }
  :root[data-theme="dark"] .icon-sun  { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  :root:not([data-theme="dark"]) .icon-sun  { display: none; }
  :root:not([data-theme="dark"]) .icon-moon { display: block; }

  .subtitle {
    margin: 6px 0 8px;
    font-size: 14px;
    color: var(--subtitle);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  /* The subtitle's length chip is a button: it opens the picker. */
  .len-chip {
    background: var(--chip-bg);
    border: 2px solid var(--ink);
    color: var(--ink);
    border-radius: 999px;
    padding: 3px 11px;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 2px 2px 0 var(--hard);
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .len-chip:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--hard); }
  .len-chip .pin { color: var(--red); }

  #message {
    min-height: 24px;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: var(--red);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  /* ---- Board ----
     Tile size is derived from the answer's length (--cols), the number of
     tries (--rows) and the live viewport, so a 4x6 board and an 8x8 board
     both land above the keyboard without measuring anything in JS.
     Media queries below only ever retune the four knobs. */
  #board {
    --cols: 5;          /* letters in the answer  (set by JS) */
    --rows: 6;          /* guesses allowed        (set by JS) */
    --gap: 7px;
    --wpad: 62px;       /* page chrome either side of the board */
    --vb: 46;           /* share of viewport height the board may use, in % */
    --cap: 66px;        /* largest a tile ever gets */
    --floor: 30px;      /* smallest a tile gets; below this the page scrolls */
    --vbudget: calc(var(--vb) * 1vh);
    --cell: max(var(--floor), min(
      calc((100vw - var(--wpad) - (var(--cols) - 1) * var(--gap)) / var(--cols)),
      calc((var(--vbudget) - (var(--rows) - 1) * var(--gap)) / var(--rows)),
      var(--cap)
    ));
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    align-items: center;
    margin: 0 auto 14px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--cell));
    gap: var(--gap);
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    border: var(--line) solid var(--cell-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Luckiest Guy', 'Impact', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: calc(var(--cell) * 0.6);
    line-height: 1;
    padding-top: calc(var(--cell) * 0.06);
    text-transform: uppercase;
    background: var(--cell-bg);
    color: var(--cell-text);
    transition: border-color 0.12s, transform 0.1s;
  }
  /* Safari's toolbar shrinks the visible viewport; dvh follows it, vh doesn't. */
  @supports (height: 1dvh) {
    #board { --vbudget: calc(var(--vb) * 1dvh); }
  }
  .cell.filled {
    border-color: var(--cell-border-filled);
    animation: pop 0.12s ease;
  }
  @keyframes pop { 50% { transform: scale(1.09); } }
  .cell.flip { animation: flip 0.5s ease forwards; }
  @keyframes flip {
    0%   { transform: rotateX(0); }
    50%  { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  .cell.correct { background: var(--correct); border-color: var(--ink); color: var(--on-correct); }
  .cell.present { background: var(--present); border-color: var(--ink); color: var(--on-present); }
  .cell.absent  { background: var(--absent);  border-color: var(--ink); color: var(--on-absent); }

  .row.shake { animation: shake 0.5s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  .row.win-bounce .cell { animation: bounce 0.6s ease var(--d, 0s); }
  @keyframes bounce {
    0%, 20%   { transform: translateY(0); }
    40%       { transform: translateY(-26px); }
    50%       { transform: translateY(5px); }
    60%       { transform: translateY(-10px); }
    80%, 100% { transform: translateY(0); }
  }

  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin: 0 auto;
    max-width: 620px;
  }
  .kb-row { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1;
    min-width: 0;
    height: 56px;
    padding: 0 4px;
    border: var(--line) solid var(--ink);
    border-radius: 9px;
    background: var(--key-bg);
    color: var(--key-text);
    font-family: inherit;
    font-weight: 900;
    font-size: 20px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 3px 0 var(--hard);
    transition: background 0.12s, transform 0.05s, box-shadow 0.05s;
    touch-action: manipulation;
  }
  .key.wide { flex: 1.7; font-size: 13px; letter-spacing: 0.5px; }
  .key:hover { background: var(--key-bg-hover); }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--hard); }
  .key.correct { background: var(--correct); color: var(--on-correct); }
  .key.present { background: var(--present); color: var(--on-present); }
  .key.absent  { background: var(--absent);  color: var(--on-absent); }

  /* ---- Cartoon props (per-guess burst around the edges) ---- */
  .edge-prop {
    position: absolute;
    transform: scale(0) rotate(-90deg);
    animation: bloom 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    will-change: transform;
    filter: drop-shadow(2px 3px 0 rgba(23, 17, 14, 0.35));
  }
  @keyframes bloom {
    0%   { transform: scale(0) rotate(-90deg); opacity: 0; }
    40%  { opacity: 1; }
    100% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
  }
  .edge-prop svg { width: 100%; height: 100%; display: block; }

  /* ---- Win takeover ---- */
  #win-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    display: none;
    overflow: hidden;
  }
  #win-overlay.active { display: block; }

  .win-prop {
    position: absolute;
    transform: scale(0);
    will-change: transform;
    filter: drop-shadow(3px 4px 0 rgba(23, 17, 14, 0.3));
    animation:
      winGrow 0.7s var(--grow-delay, 0ms) cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
      winShrink 0.6s var(--retract-delay, 2000ms) cubic-bezier(0.5, 0, 0.75, 0) forwards;
  }
  .win-prop svg { width: 100%; height: 100%; display: block; }
  @keyframes winGrow {
    0%   { transform: scale(0) rotate(-90deg); }
    100% { transform: scale(1) rotate(var(--rot, 0deg)); }
  }
  @keyframes winShrink {
    0%   { transform: scale(1) rotate(var(--rot, 0deg)); }
    100% { transform: scale(0) rotate(calc(var(--rot, 0deg) + 90deg)); }
  }

  .win-message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.6s ease, transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 11;
    pointer-events: none;
    padding: 0 16px;
  }
  .win-message.show { opacity: 1; transform: scale(1); }
  .win-panel {
    background: var(--panel);
    border: var(--line) solid var(--ink);
    border-radius: 22px;
    padding: 24px 34px;
    box-shadow: 8px 9px 0 rgba(0, 0, 0, 0.5);
    max-width: calc(100vw - 32px);
  }
  .win-panel .line1 {
    font-family: 'Luckiest Guy', 'Impact', 'Arial Black', sans-serif;
    font-weight: 400;
    color: var(--yellow);
    font-size: clamp(30px, 6.4vw, 66px);
    line-height: 1.1;
    letter-spacing: 1px;
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 3px 3px 0 var(--red);
  }
  .win-panel .line2 {
    color: #fff6e0;
    font-size: clamp(20px, 4.2vw, 42px);
    font-weight: 900;
    letter-spacing: 5px;
    margin-top: 10px;
  }
  .win-panel .line3 {
    color: var(--yellow);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
  }

  .win-actions {
    position: absolute;
    left: 50%;
    bottom: calc(9% + env(safe-area-inset-bottom));
    transform: translateX(-50%) scale(0.9);
    display: flex;
    gap: 10px;
    padding: 11px 14px;
    background: var(--panel);
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    box-shadow: 6px 7px 0 rgba(0, 0, 0, 0.45);
    opacity: 0;
    transition: opacity 0.45s ease, transform 0.45s ease;
    z-index: 12;
    pointer-events: auto;
  }
  .win-actions.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .win-btn {
    padding: 12px 22px;
    background: var(--yellow);
    color: var(--ink);
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
    flex: 0 0 auto;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.8);
    font-family: inherit;
    touch-action: manipulation;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .win-btn.alt { background: var(--red); color: #fff; }
  .win-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.8); }

  /* ---- Modals ---- */
  .modal { position: fixed; inset: 0; z-index: 100; display: none; }
  .modal.active { display: block; }
  .modal-backdrop { position: absolute; inset: 0; background: var(--modal-overlay); }
  .modal-card {
    position: relative;
    margin: calc(20px + env(safe-area-inset-top)) auto calc(20px + env(safe-area-inset-bottom));
    max-width: 620px;
    width: calc(100% - 32px);
    max-height: calc(100dvh - 40px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--modal-bg);
    color: var(--text);
    border: var(--line) solid var(--ink);
    border-radius: 20px;
    padding: 26px 20px 22px;
    box-shadow: 8px 9px 0 var(--hard);
  }
  /* Focused programmatically when the dialog opens; no ring needed for that. */
  .modal-card:focus { outline: none; }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: var(--red);
    border: 2px solid var(--ink);
    cursor: pointer;
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    border-radius: 50%;
    touch-action: manipulation;
  }
  .modal-close:active { transform: translate(1px, 1px); }
  .modal h2 {
    margin: 0 0 16px;
    text-align: center;
    font-family: 'Luckiest Guy', 'Impact', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: 25px;
    letter-spacing: 1px;
    color: var(--title);
    -webkit-text-stroke: 1.5px var(--ink);
    paint-order: stroke fill;
    text-shadow: 2px 2px 0 var(--title-shadow);
    padding: 0 30px;
  }
  .modal h3 {
    margin: 18px 0 10px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.75;
    font-weight: 900;
  }

  /* Category picker */
  #topics-grid { display: flex; flex-direction: column; gap: 9px; }
  .cat-btn {
    display: flex;
    align-items: center;
    gap: 13px;
    width: 100%;
    padding: 13px 14px;
    border: var(--line) solid var(--ink);
    border-radius: 15px;
    background: var(--cell-bg);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    box-shadow: 3px 3px 0 var(--hard);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
  }
  .cat-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--hard); }
  .cat-btn.active { background: var(--yellow); color: var(--ink); }
  .cat-btn.active .cat-name { color: var(--ink); }
  .cat-btn.done { background: var(--correct); color: #fff; }
  .cat-btn.done .cat-name, .cat-btn.done .cat-hint { color: #fff; }
  .cat-icon { font-size: 27px; line-height: 1; flex: 0 0 auto; }
  .cat-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .cat-name {
    font-family: 'Luckiest Guy', 'Impact', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: 18px;
    letter-spacing: 0.5px;
    color: var(--red);
  }
  .cat-hint { font-size: 12.5px; font-weight: 800; font-style: italic; opacity: 0.85; }
  .cat-prog { font-size: 12px; font-weight: 900; letter-spacing: 0.6px; opacity: 0.9; }

  /* Length picker + stats scope switcher share the same pill-row look.
     Each lays out as "one wide pill across the top, then an even row" so the
     last option never wraps onto a ragged second line. */
  /* Column counts are set in JS from the number of options, so adding a
     category or a new word length can't leave a ragged trailing row. */
  .pick-row { display: grid; gap: 6px; justify-items: stretch; }
  #length-grid { grid-template-columns: repeat(5, 1fr); }
  #stats-scope-grid { grid-template-columns: repeat(6, 1fr); }
  .pick:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .pick-row .pick.wide { grid-column: 1 / -1; }
  .pick {
    min-width: 0;
    min-height: 42px;
    padding: 7px 4px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--cell-bg);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.5px;
    line-height: 1.15;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 2px 2px 0 var(--hard);
    transition: transform 0.06s, box-shadow 0.06s, background 0.15s;
  }
  .pick.wide { text-transform: uppercase; font-size: 13px; }
  .pick:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--hard); }
  .pick.on { background: var(--yellow); color: var(--ink); }
  .pick .sub { display: block; font-size: 9.5px; letter-spacing: 0.4px; opacity: 0.65; margin-top: 1px; }
  .pick-note {
    margin: 8px 0 0;
    font-size: 11.5px;
    font-weight: 800;
    text-align: center;
    opacity: 0.7;
    line-height: 1.35;
  }

  /* Found words */
  .found-section {
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 11px 12px;
    margin-bottom: 10px;
    background: var(--cell-bg);
  }
  .found-section.current { box-shadow: 3px 3px 0 var(--hard); }
  .found-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-weight: 900;
    font-size: 14.5px;
    margin-bottom: 9px;
    letter-spacing: 0.4px;
  }
  .found-count {
    font-size: 12.5px;
    color: var(--ink);
    background: var(--chip-bg);
    border: 2px solid var(--ink);
    padding: 2px 9px;
    border-radius: 999px;
    flex: 0 0 auto;
  }
  .found-count.done { background: var(--correct); color: #fff; }
  .len-group { display: flex; align-items: baseline; gap: 7px; margin-bottom: 6px; }
  .len-tag {
    font-size: 11px;
    font-weight: 900;
    opacity: 0.6;
    min-width: 14px;
    flex: 0 0 auto;
    letter-spacing: 0.5px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1.2px;
    padding: 4px 8px;
    border-radius: 7px;
    border: 2px solid var(--ink);
  }
  .chip.got { background: var(--correct); color: #fff; }
  .chip.locked { background: var(--bar-bg); color: var(--text); opacity: 0.65; }

  /* Stats */
  .stats-numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .stat { text-align: center; padding: 4px 2px; }
  .stat-num {
    font-family: 'Luckiest Guy', 'Impact', 'Arial Black', sans-serif;
    font-weight: 400;
    font-size: 31px;
    color: var(--text);
    line-height: 1.1;
  }
  .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.75; margin-top: 3px; line-height: 1.2; font-weight: 900; }

  #distribution { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; }
  .dist-row {
    display: grid;
    grid-template-columns: 16px 1fr;
    gap: 7px;
    align-items: center;
    font-size: 13px;
    font-weight: 900;
    color: var(--text);
  }
  .dist-bar {
    background: var(--bar-bg);
    border: 2px solid var(--ink);
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 7px;
    color: var(--text);
    min-width: 26px;
    font-size: 12px;
    transition: width 0.5s ease;
  }
  .dist-bar.highlight { background: var(--correct); color: #fff; }
  .stats-scope {
    font-size: 11.5px;
    font-weight: 900;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    text-align: center;
    margin: 0 0 12px;
    opacity: 0.8;
    min-height: 15px;
  }
  .stats-empty { text-align: center; font-size: 12.5px; font-weight: 800; opacity: 0.6; margin: 0 0 16px; }
  .share-btn {
    display: block;
    margin: 4px auto 0;
    padding: 12px 30px;
    background: var(--red);
    color: #fff;
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 3px 3px 0 var(--hard);
    transition: transform 0.06s, box-shadow 0.06s, opacity 0.15s;
    touch-action: manipulation;
  }
  .share-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .share-btn:not(:disabled):active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--hard); }

  .footer-note {
    margin: 14px 0 0;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    opacity: 0.55;
  }

  /* ---- Responsiveness: phone-first, then trims for short windows ---- */

  /* Laptop-height windows: trim the chrome so the keyboard stays in view
     even for an 8x8 board. */
  @media (min-width: 621px) and (max-height: 900px) {
    .topbar h1 { font-size: clamp(24px, 3.6vw, 40px); }
    #board { --vb: 42; --cap: 56px; }

  }

  @media (max-width: 620px) {

    .icon-btn { width: 38px; height: 38px; }
    /* Collapse secondary labels so the action bar stays one row. */
    #topics-btn .btn-label, #found-btn .btn-label { display: none; }
    #topics-btn, #found-btn { padding: 8px 10px; }
    .subtitle { font-size: 11.5px; letter-spacing: 1.2px; margin: 5px 0 5px; gap: 6px; }
    .len-chip { font-size: 10.5px; padding: 2px 8px; }
    #message { min-height: 19px; font-size: 13px; margin-bottom: 4px; }
    #board { --gap: 5px; --wpad: 34px; --vb: 50; --cap: 58px; margin-bottom: 10px; }
    #keyboard { gap: 6px; }
    .kb-row { gap: 4px; }
    .key { height: 50px; font-size: 18px; border-radius: 8px; }

  /* iPhone SE / mini-class heights. */
  @media (max-width: 620px) and (max-height: 780px) {
    #board { --vb: 45; --cap: 54px; }
    .key { height: 45px; }
  }
  @media (max-width: 620px) and (max-height: 680px) {
    #board { --vb: 43; --cap: 48px; }

  }
  /* Any short viewport — landscape phone, small desktop window. Keyed on
     height alone, since a landscape iPhone is wider than the phone breakpoint. */
  @media (max-height: 560px) {
    body { align-items: flex-start; padding-top: calc(5px + env(safe-area-inset-top)); }
    .game { padding: 9px 12px 10px; }
    .topbar h1 {
      font-size: clamp(19px, 3.4vw, 30px);

    .key { height: 34px; font-size: 15px; }
    .key.wide { font-size: 11px; }
    .footer-note { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;

  }

<body>
  <div class="prop-layer" id="prop-edge" aria-hidden="true"></div>

    <div class="topbar">

      <button type="button" class="modal-close" data-close="stats-modal" aria-label="Close statistics">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div id="stats-scope-grid" class="pick-row"></div>
      <p class="stats-scope" id="stats-scope-label"></p>
      <div class="stats-numbers">
        <div class="stat"><div class="stat-num" id="stat-played">0</div><div class="stat-label">Played</div></div>
        <div class="stat"><div class="stat-num" id="stat-winpct">0</div><div class="stat-label">Win&nbsp;%</div></div>
        <div class="stat"><div class="stat-num" id="stat-cur">0</div><div class="stat-label">Current Streak</div></div>
        <div class="stat"><div class="stat-num" id="stat-max">0</div><div class="stat-label">Max Streak</div></div>
      </div>
      <h3 id="dist-head">Guess Distribution</h3>
      <div id="distribution"></div>
      <p class="stats-empty" id="stats-empty" hidden>No games here yet.</p>
      <button id="share-btn" type="button" class="share-btn" disabled>Share</button>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ---------- Categories ----------
    // Six categories, 30 answers each: six words at every length from 4 to 8.
    // Proper nouns very much welcome — they are the whole point.
    // Hints follow one pattern: who or what it's about, in Title Case, with two
    // subjects joined by "&" and a single subject left bare. No colons, no lists.
    // "Rodgers and Hammerstein" keeps its own "and" because that's the duo's
    // name; the "&" still separates the two subjects.
    let CATEGORIES = [
      { id: 'q36',     label: 'Q36',                  hint: 'Marvin',                            icon: '🛸' },
      { id: 'pursuit', label: 'Happiness of Pursuit', hint: 'Road Runner & Wile E. Coyote',      icon: '💥' },
      { id: 'pismo',   label: 'Pismo Beach',          hint: 'Bugs & Daffy',                      icon: '🥕' },
      { id: 'boba',    label: 'Boba Fettucine',       hint: 'Star Wars & Spaghetti Westerns',    icon: '🤠' },
      { id: 'slanky',  label: 'Slanky',               hint: 'Mike Doughty & Soul Coughing',      icon: '🎺' },
      { id: 'taut',    label: 'Carefully Taut',       hint: 'Rodgers and Hammerstein & Hamilton', icon: '🎭' },
      { id: 'pixar',   label: 'Infinity and Beyond',  hint: 'Pixar',                             icon: '🚀' }
    ];

    const WORDS = {
      // Q36 — the Illudium Q-36 Explosive Space Modulator and its owner
      q36: [
        'MARS','MOON','ATOM','BOOM','FUSE','DOME',
        'ANGRY','BROOM','ORBIT','SPACE','VENUS','EARTH',
        'MARVIN','KABOOM','HELMET','ROCKET','PLANET','PISTOL',
        'MARTIAN','DODGERS','CENTURY','BLASTER','ANTENNA','URANIUM',
        'ILLUDIUM','SPACEMAN','ASTEROID','SNEAKERS','MODULATE','DOOMSDAY'
      ],
      // Happiness of Pursuit — Accelleratii Incredibus vs. Carnivorous Vulgaris
      pursuit: [
        'ACME','BEEP','MESA','ROAD','DUST','WILE',
        'ANVIL','CLIFF','PAINT','SPEED','ROCKS','LEDGE',
        'COYOTE','CANYON','DESERT','GENIUS','TUNNEL','DETOUR',
        'BOULDER','GRAVITY','BEEPING','PLUMMET','FEATHER','HIGHWAY',
        'DYNAMITE','CATAPULT','BIRDSEED','FREEFALL','UNICYCLE','DOWNHILL'
      ],
      // Pismo Beach — and all the clams we can eat
      pismo: [
        'HARE','DUCK','CLAM','FUDD','HOLE','STEW',
        'DAFFY','PORKY','PISMO','OPERA','TUNES','BEACH',
        'CARROT','RABBIT','WABBIT','SEASON','NIMROD','LOONEY',
        'SEVILLE','STINKER','SHOTGUN','HUNTERS','BARBERS','BURROWS',
        'YOSEMITE','BUCKSHOT','DISGUISE','CLAMBAKE','SABOTAGE','SEASHELL'
      ],
      // Boba Fettucine — bounty hunters, twin suns, and a man with no name
      boba: [
        'HOTH','JAWA','EWOK','SITH','TUCO','DUEL',
        'JANGO','JABBA','VADER','LEONE','ENDOR','SPURS',
        'BESPIN','GREEDO','DJANGO','PONCHO','BOUNTY','COFFIN',
        'SARLACC','CANTINA','BLONDIE','JETPACK','CHEROOT','DOLLARS',
        'TATOOINE','EASTWOOD','STANDOFF','CHEYENNE','GUNFIGHT','REVOLVER'
      ],
      // Slanky — Soul Coughing, solo Doughty, and the sampler in the corner
      slanky: [
        'RUBY','ZOOM','MARY','JAZZ','WELL','SIGN',
        'VROOM','BELLS','WHITE','MOTEL','GHOST','SUGAR',
        'JANINE','GOLDEN','SLANKY','BITTER','DEVILS','SAMPLE',
        'CIRCLES','DOUGHTY','WICHITA','ROLLING','MELODIC','CHICAGO',
        'SKITTISH','COLLAPSE','OSSINING','COUGHING','MADELINE','JENNIFER'
      ],
      // Carefully Taut — Rodgers & Hammerstein, plus the room where it happens
      taut: [
        'ANNA','BURR','LIAT','BURN','ROLF','DAME',
        'ELIZA','MARIA','LIESL','CURLY','PEGGY','TRAPP',
        'LAUREY','NELLIE','TUPTIM','SURREY','ABBESS','LOVERS',
        'BIGELOW','LAURENS','MADISON','NONSTOP','SIXTEEN','RODGERS',
        'HAMILTON','OKLAHOMA','SCHUYLER','CAROUSEL','YORKTOWN','ANGELICA'
      ],
      // Infinity and Beyond — Toy Story, Monsters Inc, A Bug's Life, Nemo
      pixar: [
        'BUZZ','ZURG','MIKE','FLIK','NEMO','DORY',
        'WOODY','SULLY','CELIA','ROSIE','BRUCE','CRUSH',
        'JESSIE','SLINKY','FUNGUS','HOPPER','SQUIRT','MARLIN',
        'RANDALL','FRANCIS','ANTHILL','ANEMONE','DENTIST','SHERIFF',
        'BULLSEYE','SOLDIERS','WAZOWSKI','CANISTER','HEIMLICH','SEAGULLS'
      ]
    };

    // A category listed without a word list would break every screen that
    // touches it, so drop it here instead. auditWords() below says why.
    const DROPPED = CATEGORIES.filter(c => !Array.isArray(WORDS[c.id]) || !WORDS[c.id].length);
    CATEGORIES = CATEGORIES.filter(c => Array.isArray(WORDS[c.id]) && WORDS[c.id].length > 0);

    const TOPIC_IDS = CATEGORIES.map(c => c.id);
    const DEFAULT_TOPIC = TOPIC_IDS.indexOf('pismo') !== -1 ? 'pismo' : TOPIC_IDS[0];

    // Longer words earn more guesses.
    function guessesFor(len) {
      if (len <= 5) return 6;
      if (len <= 7) return 7;
      return 8;
    }

    // ---------- Derived from the word lists, never hardcoded ----------
    // ADDING A CATEGORY: append an entry to CATEGORIES and a matching array to
    // WORDS under the same id. Everything below adapts — the length picker, the
    // guess-distribution height, the stats card and the found list. Saved
    // progress is keyed by category id, so existing data is untouched; the new
    // category simply starts empty. Don't reuse an id, and don't rename one (a
    // rename orphans that category's saved stats, though they are preserved in
    // storage rather than deleted, so restoring the old id brings them back).
    const LENGTHS = (function () {
      const seen = {};
      TOPIC_IDS.forEach(id => (WORDS[id] || []).forEach(w => { seen[w.length] = true; }));
      return Object.keys(seen).map(Number).sort((a, b) => a - b);
    })();

    // Tall enough for the most generous word length in the data.
    const DIST_BUCKETS = LENGTHS.length
      ? LENGTHS.reduce((m, n) => Math.max(m, guessesFor(n)), 0)
      : 8;

    // Sanity check for whoever edits the lists next. Console-only: never blocks
    // play, since a wonky list is still perfectly playable.
    (function auditWords() {
      if (typeof console === 'undefined' || !console.warn) return;
      const warn = m => console.warn('[word list] ' + m);
      // The likeliest slip when adding a category: forgetting the word list.
      DROPPED.forEach(c => warn('category "' + c.id + '" has no WORDS entry — it was skipped. ' +
                                'Add WORDS.' + c.id + ' = [...] to enable it.'));

      const counts = {}, seen = {};
      TOPIC_IDS.forEach(id => {
        const list = WORDS[id];
        counts[id] = list.length;
        const within = {};
        list.forEach(w => {
          if (!/^[A-Z]+$/.test(w)) warn('"' + w + '" in ' + id + ' is not plain A-Z');
          if (within[w]) { warn('"' + w + '" is repeated inside ' + id); return; }
          within[w] = true;
          if (seen[w]) warn('"' + w + '" appears in both ' + seen[w] + ' and ' + id);
          else seen[w] = id;
        });
      });
      const totals = Object.keys(counts).map(k => counts[k]);
      if (totals.length && Math.min.apply(null, totals) !== Math.max.apply(null, totals)) {
        warn('categories have different totals: ' +
             Object.keys(counts).map(k => k + '=' + counts[k]).join(', '));
      }
      Object.keys(WORDS).forEach(id => {
        if (TOPIC_IDS.indexOf(id) === -1) warn('WORDS has "' + id + '" but no CATEGORIES entry — it is unreachable');
      });
    })();

    function topicMeta(id) {
      const cat = CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
      return cat;
    }

    // Column count for a pill row: as many per row as will stay comfortably
    // tappable, then evened out so the last row is never nearly empty
    // (7 items in a 4-wide space becomes 4+3, not 4+3 stranded as 6+1).
    const PILL_MIN = 38, PILL_GAP = 6;
    function balancedCols(count, el) {
      if (count <= 1) return 1;
      const avail = (el && el.clientWidth) || 320;
      const perRow = Math.max(1, Math.floor((avail + PILL_GAP) / (PILL_MIN + PILL_GAP)));
      const rows = Math.ceil(count / Math.min(count, perRow));
      return Math.ceil(count / rows);
    }
    function applyCols(el, count) {
      el.style.gridTemplateColumns = 'repeat(' + balancedCols(count, el) + ', 1fr)';
    }

    // Any correctly-sized string of letters is a legal guess: the answers are
    // largely proper nouns, so a dictionary would reject more than it caught.

    // ---------- Storage (degrades to in-memory if localStorage throws) ----------
    // Keys are unchanged from the previous edition so streaks carry over.
    const KEY = {
      topic:   'catsWordle:topic',
      current: 'catsWordle:current',
      found:   'catsWordle:found',
      stats:   'catsWordle:stats',
      theme:   'catsWordle:theme',
      length:  'catsWordle:length'
    };
    // Some contexts (a file:// page, private browsing with storage disabled)
    // refuse localStorage outright. The game still plays; the scoreboard just
    // won't survive a reload, and the player deserves to be told once.
    const STORAGE_OK = (function () {
      try {
        const probe = 'catsWordle:probe';
        localStorage.setItem(probe, '1');
        localStorage.removeItem(probe);
        return true;
      } catch (_) { return false; }
    })();

    function readStorage(k)  { try { return localStorage.getItem(k); } catch (_) { return null; } }
    function writeStorage(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
    function removeStorage(k) { try { localStorage.removeItem(k); } catch (_) {} }
    function readJSON(k, fallback) {
      const raw = readStorage(k);
      if (raw == null) return fallback;
      try { return JSON.parse(raw); } catch (_) { return fallback; }
    }

    // ---------- Topic + answer selection ----------
    function loadTopic() {
      const t = readStorage(KEY.topic);
      return (t && TOPIC_IDS.indexOf(t) !== -1) ? t : DEFAULT_TOPIC;
    }
    function saveTopic(t) { writeStorage(KEY.topic, t); }

    function loadFound() {
      const f = readJSON(KEY.found, {});
      return (f && typeof f === 'object') ? f : {};
    }
    function saveFound(f) { writeStorage(KEY.found, JSON.stringify(f)); }
    function foundFor(topic) {
      const all = WORDS[topic];
      const arr = loadFound()[topic];
      if (!Array.isArray(arr) || !Array.isArray(all)) return [];
      // Words dropped from a list stop counting here but stay in storage, so
      // putting one back restores it as already found.
      return arr.filter(w => all.indexOf(w) !== -1);
    }
    function markFound(topic, word) {
      const f = loadFound();
      if (!Array.isArray(f[topic])) f[topic] = [];
      if (f[topic].indexOf(word) === -1) f[topic].push(word);
      saveFound(f);
    }

    // ---------- Length filter: a specific length, or 'any' for the lot ----------
    function loadLength() {
      const n = parseInt(readStorage(KEY.length), 10);
      return LENGTHS.indexOf(n) !== -1 ? n : 'any';
    }
    function saveLength(n) {
      if (n === 'any') removeStorage(KEY.length);
      else writeStorage(KEY.length, String(n));
    }
    function inFilter(w) { return lengthFilter === 'any' || w.length === lengthFilter; }

    function loadCurrentAnswer() {
      const c = readJSON(KEY.current, null);
      if (c && c.topic === currentTopic &&
          WORDS[currentTopic].indexOf(c.answer) !== -1 &&
          inFilter(c.answer)) return c.answer;
      return null;
    }
    function saveCurrentAnswer(w) { writeStorage(KEY.current, JSON.stringify({ topic: currentTopic, answer: w })); }
    function clearCurrentAnswer() { removeStorage(KEY.current); }

    function pickAnswer() {
      const saved = loadCurrentAnswer();
      if (saved) return saved;
      const found = foundFor(currentTopic);
      const eligible = WORDS[currentTopic].filter(inFilter);
      // Prefer words not yet found; once a length (or a whole category) is
      // cleared, replay that same set rather than widening the filter.
      let pool = eligible.filter(w => found.indexOf(w) === -1);
      if (pool.length === 0) pool = eligible.slice();
      if (pool.length === 0) pool = WORDS[currentTopic].slice(); // filter matched nothing
      const w = pool[Math.floor(Math.random() * pool.length)];
      saveCurrentAnswer(w);
      return w;
    }

    // ---------- Stats ----------
    // One block of counters for the whole game, plus an identical block per
    // category, so a category streak survives switching away and back.
    function blankBlock() {
      return {
        played: 0, won: 0, currentStreak: 0, maxStreak: 0,
        distribution: new Array(DIST_BUCKETS).fill(0),
        lastWinRow: -1
      };
    }
    function readBlock(raw) {
      const out = blankBlock();
      if (!raw || typeof raw !== 'object') return out;
      // Clamp: a hand-edited or corrupted save shouldn't render as "-1999%".
      ['played','won','currentStreak','maxStreak','lastWinRow'].forEach(k => {
        const v = raw[k];
        if (typeof v !== 'number' || !isFinite(v)) return;
        out[k] = k === 'lastWinRow' ? Math.max(-1, Math.floor(v)) : Math.max(0, Math.floor(v));
      });
      // Older saves stored six buckets; pad rather than discard the history.
      // A save with MORE buckets than we currently need keeps them all, so
      // shortening the word lists can never silently delete past results.
      if (Array.isArray(raw.distribution)) {
        const n = Math.max(DIST_BUCKETS, raw.distribution.length);
        out.distribution = new Array(n).fill(0);
        for (let i = 0; i < n; i++) {
          const v = raw.distribution[i];
          out.distribution[i] = typeof v === 'number' ? v : 0;
        }
      }
      return out;
    }
    function defaultStats() {
      const s = blankBlock();
      s.topics = {};
      return s;
    }
    function loadStats() {
      const raw = readJSON(KEY.stats, null);
      const out = readBlock(raw);
      out.topics = {};
      const t = raw && raw.topics;
      if (t && typeof t === 'object') {
        // Read EVERY stored id, not just the ones currently in CATEGORIES.
        // saveStats writes back whatever this returns, so filtering here would
        // permanently delete the stats of any category that was renamed or
        // temporarily removed. Unknown ids stay parked and invisible.
        Object.keys(t).forEach(id => { out.topics[id] = readBlock(t[id]); });
      }
      return out;
    }
    function saveStats(s) { writeStorage(KEY.stats, JSON.stringify(s)); }
    function statsFor(s, id) { return s.topics[id] || blankBlock(); }

    // Applies the same mutation to the global block and the category block.
    function record(topic, mutate) {
      const s = loadStats();
      const block = statsFor(s, topic);
      mutate(s);
      mutate(block);
      s.topics[topic] = block;
      saveStats(s);
      return s;
    }
    function recordWin(rowIndex) {
      return record(currentTopic, b => {
        b.played++; b.won++; b.currentStreak++;
        if (b.currentStreak > b.maxStreak) b.maxStreak = b.currentStreak;
        if (rowIndex >= 0 && rowIndex < DIST_BUCKETS) b.distribution[rowIndex]++;
        b.lastWinRow = rowIndex;
      });
    }
    function recordLoss() {
      return record(currentTopic, b => {
        b.played++; b.currentStreak = 0; b.lastWinRow = -1;
      });
    }

    // ---------- Theme ----------
    function loadTheme() {
      const t = readStorage(KEY.theme);
      if (t === 'light' || t === 'dark') return t;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }
    function setTheme(t) { writeStorage(KEY.theme, t); applyTheme(t); }
    applyTheme(loadTheme());

    // ---------- Share ----------
    let lastShareText = null;
    function buildShareText(rows, won) {
      const map = { correct: '🟩', present: '🟨', absent: '⬛' };
      const grid = rows.map(r => r.map(s => map[s] || '⬛').join('')).join('\n');
      const score = won ? rows.length : 'X';
      const t = topicMeta(currentTopic);
      return 'Left Turn at Albuquerque\n' +
             t.label + ' · ' + ANSWER.length + ' letters\n' +
             score + '/' + maxGuesses + '\n\n' + grid;
    }
    async function share() {
      if (!lastShareText) return;
      try {
        if (navigator.share) { await navigator.share({ text: lastShareText }); return; }
      } catch (_) { /* cancelled — fall through to clipboard */ }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(lastShareText);
          showMessage('Copied!');
          return;
        }
      } catch (_) { /* fall through */ }
      const ta = document.createElement('textarea');
      ta.value = lastShareText;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.setAttribute('readonly', '');
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showMessage('Copied!'); } catch (_) {}
      document.body.removeChild(ta);
    }

    // ---------- Cartoon prop SVGs ----------
    const INK = '#17110e';

        <circle cx="14" cy="38" r="2.6" fill="#f7c51e" stroke="${INK}" stroke-width="1.6"/>

    const crateSVG = () => `
      <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="18" width="48" height="34" rx="3" fill="#cf9550" stroke="${INK}" stroke-width="2.6"/>
        <path d="M6 27h48M6 45h48" stroke="${INK}" stroke-width="1.8"/>

        <text x="30" y="40.5" text-anchor="middle" font-family="'Luckiest Guy',Impact,'Arial Black',sans-serif"
              font-size="12" fill="${INK}" letter-spacing="1">ACME</text>
      </svg>`;

    const EDGE_PROPS = [anvilSVG, carrotSVG, tntSVG, starSVG];
    const WIN_PROPS  = [anvilSVG, carrotSVG, tntSVG, starSVG, bullseyeSVG, saucerSVG, crateSVG];

    // ---------- DOM refs ----------
    const board       = document.getElementById('board');
    const keyboard    = document.getElementById('keyboard');
    const messageEl   = document.getElementById('message');
    const propLayer   = document.getElementById('prop-edge');
    const winOverlay  = document.getElementById('win-overlay');
    const topicLabel  = document.getElementById('topic-label');
    const retryBtn    = document.getElementById('retry');
    const themeBtn    = document.getElementById('theme-toggle');
    const statsBtn    = document.getElementById('stats-btn');
    const topicsBtn   = document.getElementById('topics-btn');
    const foundBtn    = document.getElementById('found-btn');
    const shareBtn    = document.getElementById('share-btn');
    const topicsModal = document.getElementById('topics-modal');
    const foundModal  = document.getElementById('found-modal');
    const statsModal  = document.getElementById('stats-modal');

    // ---------- Game state ----------
    let currentTopic = loadTopic();
    let lengthFilter = loadLength();   // 4..8, or 'any'
    let statsView = 'all';             // 'all', or a category id
    let currentRow = 0;
    let currentGuess = '';
    let gameOver = false;
    let isSubmitting = false;
    let ANSWER = '';
    let maxGuesses = 6;
    let epoch = 0;              // bumped by reset(); invalidates in-flight timers
    let warnedStorage = false;
    const submittedRows = [];

    // ---------- Build UI ----------
    function buildBoard() {
      board.innerHTML = '';
      // The CSS sizes every tile from these two numbers, so an 8-letter word
      // with 8 rows still fits above the keyboard on a phone.
      board.style.setProperty('--cols', ANSWER.length);
      board.style.setProperty('--rows', maxGuesses);
      for (let r = 0; r < maxGuesses; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = 'row-' + r;
        for (let c = 0; c < ANSWER.length; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = 'cell-' + r + '-' + c;
          cell.style.setProperty('--d', (c * 0.09) + 's');
          row.appendChild(cell);
        }
        board.appendChild(row);
      }
    }

    function buildKeyboard() {
      keyboard.innerHTML = '';
      const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
      rows.forEach((rowStr, i) => {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        if (i === 2) rowEl.appendChild(makeKey('ENTER', 'wide'));
        for (const ch of rowStr) rowEl.appendChild(makeKey(ch));
        if (i === 2) rowEl.appendChild(makeKey('BACK', 'wide'));
        keyboard.appendChild(rowEl);
      });
    }

    function makeKey(label, extra) {
      const k = document.createElement('button');
      k.type = 'button';
      k.className = ('key ' + (extra || '')).trim();
      k.dataset.key = label;
      k.textContent = label === 'BACK' ? '⌫' : label;
      // The glyph alone gives a screen reader nothing useful to say.
      if (label === 'BACK') k.setAttribute('aria-label', 'Backspace');
      k.addEventListener('click', (e) => { e.preventDefault(); k.blur(); handleKey(label); });
      return k;
    }

    function updateTopicLabel() {
      const t = topicMeta(currentTopic);
      topicLabel.innerHTML = '';
      const name = document.createElement('span');
      name.textContent = t.icon + ' ' + t.label;

      // Doubles as the way in to the length picker.
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'len-chip';
      chip.title = 'Choose word length';
      chip.setAttribute('aria-label',
        'Word length: ' + (lengthFilter === 'any' ? 'any' : lengthFilter) + '. Change it.');
      chip.textContent = ANSWER.length + ' letters · ' + maxGuesses + ' tries';
      // A dot marks the length as pinned rather than drawn at random.
      if (lengthFilter !== 'any') {
        const pin = document.createElement('span');
        pin.className = 'pin';
        pin.textContent = ' ●';
        chip.appendChild(pin);
      }
      chip.addEventListener('click', () => { chip.blur(); openTopics(topicsBtn); });

      topicLabel.appendChild(name);
      topicLabel.appendChild(chip);
    }

    // ---------- Input ----------
    function handleKey(key) {
      if (gameOver || isSubmitting) return;
      if (key === 'ENTER') return submitGuess();
      if (key === 'BACK') {
        if (currentGuess.length > 0) {
          currentGuess = currentGuess.slice(0, -1);
          updateRow();
        }
        return;
      }
      if (/^[A-Z]$/.test(key) && currentGuess.length < ANSWER.length) {
        currentGuess += key;
        updateRow();
      }
    }

    function updateRow() {
      for (let c = 0; c < ANSWER.length; c++) {
        const cell = document.getElementById('cell-' + currentRow + '-' + c);
        const ch = currentGuess[c] || '';
        const had = cell.textContent;
        cell.textContent = ch;
        if (ch && !had) cell.classList.add('filled');
        if (!ch) cell.classList.remove('filled');
      }
    }

    function showMessage(msg, ms) {
      ms = ms || 1500;
      messageEl.textContent = msg;
      clearTimeout(messageEl._t);
      messageEl._t = setTimeout(() => { messageEl.textContent = ''; }, ms);
    }

    function shakeRow(r) {
      const row = document.getElementById('row-' + r);
      row.classList.remove('shake');
      void row.offsetWidth;
      row.classList.add('shake');
      setTimeout(() => row.classList.remove('shake'), 500);
    }

    // ---------- Scoring (with proper duplicate-letter handling) ----------
    function scoreGuess(guess, answer) {
      const result = new Array(answer.length).fill('absent');
      const rem = answer.split('');
      for (let i = 0; i < guess.length; i++) {
        if (guess[i] === rem[i]) { result[i] = 'correct'; rem[i] = null; }
      }
      for (let i = 0; i < guess.length; i++) {
        if (result[i] === 'correct') continue;
        const idx = rem.indexOf(guess[i]);
        if (idx >= 0) { result[i] = 'present'; rem[idx] = null; }
      }
      return result;
    }

    // ---------- Submit ----------
    function submitGuess() {
      if (currentGuess.length !== ANSWER.length) {
        shakeRow(currentRow);
        showMessage('Need ' + ANSWER.length + ' letters');
        return;
      }
      isSubmitting = true;
      // The reveal runs on timers for up to ~1.9s. If a new word starts in that
      // window (New Word, or a category/length change), those timers must not
      // fire against the fresh game: they used to read the live ANSWER and
      // currentTopic, so an interrupted win credited a random word in the wrong
      // category as found and logged a bogus result.
      const myEpoch = epoch;
      const result = scoreGuess(currentGuess, ANSWER);
      submittedRows.push(result.slice());
      const flipDur = 500;
      // Long words get a snappier stagger so an 8-letter reveal stays brisk.
      const flipStagger = ANSWER.length > 6 ? 170 : 220;

      for (let c = 0; c < ANSWER.length; c++) {
        const cell = document.getElementById('cell-' + currentRow + '-' + c);
        const status = result[c];
        ((cell, status, c) => {
          setTimeout(() => {
            if (myEpoch !== epoch) return;
            cell.classList.add('flip');
            setTimeout(() => {
              if (myEpoch !== epoch) return;
              cell.classList.add(status);
            }, flipDur / 2);
          }, c * flipStagger);
        })(cell, status, c);
      }

      // Resolve the best status this guess gives each letter BEFORE scheduling.
      // Reading k.dataset.status inside the loop while writing it inside the
      // timeouts meant a repeated letter could be scheduled twice, and the
      // later position won — so guessing SEASONAL against SEASHELL turned the
      // A key grey even though A was correct at index 2.
      const order = { absent: 0, present: 1, correct: 2 };
      const best = {};
      for (let c = 0; c < ANSWER.length; c++) {
        const ch = currentGuess[c];
        if (!best[ch] || order[result[c]] > order[best[ch].status]) {
          best[ch] = { status: result[c], at: c };
        }
      }
      Object.keys(best).forEach(ch => {
        const k = document.querySelector('.key[data-key="' + ch + '"]');
        if (!k) return;
        const cur = k.dataset.status;
        if (cur && order[best[ch].status] <= order[cur]) return;  // never downgrade
        const status = best[ch].status;
        setTimeout(() => {
          if (myEpoch !== epoch) return;
          k.classList.remove('absent', 'present', 'correct');
          k.classList.add(status);
          k.dataset.status = status;
        }, best[ch].at * flipStagger + flipDur / 2);
      });

      growEdgeProps();

      const totalDur = (ANSWER.length - 1) * flipStagger + flipDur + 200;
      const won = currentGuess === ANSWER;
      const submittedRow = currentRow;

      setTimeout(() => {
        if (myEpoch !== epoch) return;   // a new word started mid-reveal
        isSubmitting = false;
        if (won) {
          gameOver = true;
          const first = foundFor(currentTopic).indexOf(ANSWER) === -1;
          markFound(currentTopic, ANSWER);
          clearCurrentAnswer();
          recordWin(submittedRow);
          lastShareText = buildShareText(submittedRows, true);
          shareBtn.disabled = false;
          const row = document.getElementById('row-' + submittedRow);
          row.classList.add('win-bounce');
          const done = first && foundFor(currentTopic).length === WORDS[currentTopic].length;
          setTimeout(() => triggerWin(done), 700);
        } else {
          currentRow++;
          currentGuess = '';
          if (currentRow >= maxGuesses) {
            gameOver = true;
            clearCurrentAnswer();
            recordLoss();
            lastShareText = buildShareText(submittedRows, false);
            shareBtn.disabled = false;
            setTimeout(triggerLoss, 400);
          }
        }
      }, totalDur);
    }

    // ---------- Edge props (one burst per guess) ----------
    function growEdgeProps() {
      if (reducedMotion()) return;
      const w = window.innerWidth, h = window.innerHeight;
      const count = 9;
      // Props are only cleared on reset, so an eight-guess game would otherwise
      // leave ~72 finished SVGs stacked up. Retire the oldest as we go.
      while (propLayer.childNodes.length > count * 3) {
        propLayer.removeChild(propLayer.firstChild);
      }
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'edge-prop';
        el.innerHTML = EDGE_PROPS[Math.floor(Math.random() * EDGE_PROPS.length)]();

        const side = Math.floor(Math.random() * 4);
        const along = Math.random();
        const depth = Math.random() * 0.13;
        let x, y;
        if (side === 0)      { x = along * w; y = depth * h; }
        else if (side === 1) { x = (1 - depth) * w; y = along * h; }
        else if (side === 2) { x = along * w; y = (1 - depth) * h; }
        else                 { x = depth * w; y = along * h; }

        const size = 54 + Math.random() * 40;
        el.style.left = (x - size / 2) + 'px';
        el.style.top  = (y - size / 2) + 'px';
        el.style.width  = size + 'px';
        el.style.height = size + 'px';
        el.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');
        el.style.animationDelay = (Math.random() * 0.5) + 's';
        propLayer.appendChild(el);
      }
    }

    // ---------- Win takeover ----------
    function triggerWin(categoryComplete) {
      winOverlay.innerHTML = '';
      winOverlay.classList.add('active');

      const title = categoryComplete ? "That's all, folks!" : pickCheer();
      const note = categoryComplete ? topicMeta(currentTopic).label + ' — every word found' : '';

      // With reduced motion the flood is animated away instantly, so skip it
      // rather than leaving two seconds of blank screen before the panel.
      if (reducedMotion()) {
        showEndPanel({ title: title, note: note, delay: 60 });
        return;
      }

      const w = window.innerWidth, h = window.innerHeight;
      const cellSize = Math.max(78, Math.min(112, w / 5));
      const cols = Math.ceil(w / cellSize) + 1;
      const rows = Math.ceil(h / cellSize) + 1;
      const cx = w / 2, cy = h / 2;
      const maxDist = Math.hypot(w / 2, h / 2);

      const GROW_MAX = 700;
      const HOLD = 700;
      const GROW_ANIM = 700;
      const RETRACT_SPREAD = 700;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const el = document.createElement('div');
          el.className = 'win-prop';
          el.innerHTML = WIN_PROPS[Math.floor(Math.random() * WIN_PROPS.length)]();

          const jitter = cellSize * 0.55;
          const x = c * cellSize + (Math.random() - 0.5) * jitter;
          const y = r * cellSize + (Math.random() - 0.5) * jitter;
          const size = cellSize * (0.9 + Math.random() * 0.5);
          el.style.left = (x - size / 2) + 'px';
          el.style.top  = (y - size / 2) + 'px';
          el.style.width  = size + 'px';
          el.style.height = size + 'px';

          const dist = Math.hypot(x - cx, y - cy);
          const tn = Math.min(1, dist / maxDist);
          const growDelay = (1 - tn) * GROW_MAX + Math.random() * 150;
          const retractStart = GROW_MAX + GROW_ANIM + HOLD;
          const retractDelay = retractStart + tn * RETRACT_SPREAD + Math.random() * 150;

          el.style.setProperty('--rot', (Math.random() * 70 - 35) + 'deg');
          el.style.setProperty('--grow-delay', growDelay + 'ms');
          el.style.setProperty('--retract-delay', retractDelay + 'ms');
          winOverlay.appendChild(el);
        }
      }

      showEndPanel({ title: title, note: note, delay: GROW_MAX + GROW_ANIM + HOLD + 100 });
    }

    function reducedMotion() {
      try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; }
    }

    // Shared end-of-game panel. A loss used to leave the board dead with only a
    // message that timed out, and no way forward on screen.
    function showEndPanel(opts) {
      const delay = opts.delay || 0;
      winOverlay.classList.add('active');

      const msg = document.createElement('div');
      msg.className = 'win-message';
      const panel = document.createElement('div');
      panel.className = 'win-panel';

      const l1 = document.createElement('div');
      l1.className = 'line1';
      l1.textContent = opts.title;
      const l2 = document.createElement('div');
      l2.className = 'line2';
      l2.textContent = ANSWER;
      panel.appendChild(l1);
      panel.appendChild(l2);
      if (opts.note) {
        const l3 = document.createElement('div');
        l3.className = 'line3';
        l3.textContent = opts.note;
        panel.appendChild(l3);
      }
      msg.appendChild(panel);
      winOverlay.appendChild(msg);

      const actions = document.createElement('div');
      actions.className = 'win-actions';

      const next = document.createElement('button');
      next.type = 'button';
      next.className = 'win-btn';
      next.textContent = 'Next Word';
      next.addEventListener('click', () => reset());

      const shareBtn2 = document.createElement('button');
      shareBtn2.type = 'button';
      shareBtn2.className = 'win-btn alt';
      shareBtn2.textContent = 'Share';
      shareBtn2.addEventListener('click', share);

      actions.appendChild(next);
      actions.appendChild(shareBtn2);
      winOverlay.appendChild(actions);

      setTimeout(() => msg.classList.add('show'), delay);
      setTimeout(() => actions.classList.add('show'), delay + 700);
    }

    // Kept short so they don't wrap in the display face.
    const CURSES = ['Curses!', 'Nice try, doc!', 'Foiled again!', 'Ah, nuts!'];
    function triggerLoss() {
      // No prop flood for a loss — just the answer and a way onward.
      winOverlay.innerHTML = '';
      showEndPanel({
        title: CURSES[Math.floor(Math.random() * CURSES.length)],
        note: 'The answer',
        delay: 60
      });
    }

    const CHEERS = [
      'Ain’t I a stinker?',
      'What’s up, doc?',
      'Beep beep!',
      'Nice work, doc!',
      'Super genius!',
      'Isn’t that lovely?',
      'You’re despicable!',
      'Of course you realize…'
    ];
    function pickCheer() { return CHEERS[Math.floor(Math.random() * CHEERS.length)]; }

    // ---------- Reset / new word ----------
    function reset() {
      epoch++;                  // any reveal still in flight now belongs to a dead game
      submittedRows.length = 0;
      ANSWER = pickAnswer();
      maxGuesses = guessesFor(ANSWER.length);
      currentRow = 0;
      currentGuess = '';
      gameOver = false;
      isSubmitting = false;
      propLayer.innerHTML = '';
      winOverlay.classList.remove('active');
      winOverlay.innerHTML = '';
      messageEl.textContent = '';
      // Don't leave the last game's grid on the Share button: once a new word
      // is up, sharing an old result is just wrong.
      lastShareText = null;
      shareBtn.disabled = true;
      buildBoard();
      buildKeyboard();
      updateTopicLabel();
      if (!STORAGE_OK && !warnedStorage) {
        warnedStorage = true;
        showMessage('Heads up — this page can’t save progress', 6000);
      }
    }

    // A reveal in flight owns the current answer and category until it settles.
    // The epoch guard keeps an interrupted reveal from corrupting the next game,
    // but letting it be interrupted would still throw away a win the player
    // earned — so hold these off for the ~1.4-1.9s a reveal lasts, exactly as
    // keyboard input is already held off. isSubmitting is always cleared by the
    // finalizer or by reset(), so this cannot wedge.
    function busy() { return isSubmitting; }

    function setTopic(topic) {
      if (busy() || TOPIC_IDS.indexOf(topic) === -1) return;
      currentTopic = topic;
      saveTopic(topic);
      clearCurrentAnswer();
      reset();
    }

    function setLength(n) {
      if (busy()) return;
      if (n !== 'any' && LENGTHS.indexOf(n) === -1) return;
      lengthFilter = n;
      saveLength(n);
      clearCurrentAnswer();   // the in-progress word may no longer qualify
      reset();
      renderLengths();
      renderTopics();
    }

    // ---------- Length picker ----------
    function renderLengths() {
      const wrap = document.getElementById('length-grid');
      const note = document.getElementById('length-note');
      wrap.innerHTML = '';

      // How many words the current category actually has at each length, so a
      // category with an uneven spread greys out what it cannot offer.
      const available = {};
      WORDS[currentTopic].forEach(w => { available[w.length] = (available[w.length] || 0) + 1; });

      applyCols(wrap, LENGTHS.length);

      const opts = [{ v: 'any', label: 'Any', sub: 'all lengths', n: 1 }].concat(
        LENGTHS.map(n => ({ v: n, label: String(n), sub: guessesFor(n) + ' tries', n: available[n] || 0 }))
      );

      opts.forEach(o => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pick' + (o.v === 'any' ? ' wide' : '') + (o.v === lengthFilter ? ' on' : '');
        btn.setAttribute('aria-pressed', String(o.v === lengthFilter));
        if (o.n === 0) {
          btn.disabled = true;
          btn.title = 'No ' + o.v + '-letter words in ' + topicMeta(currentTopic).label;
        }
        const main = document.createElement('span');
        main.textContent = o.label;
        const sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = o.n === 0 ? 'none' : o.sub;
        btn.appendChild(main);
        btn.appendChild(sub);
        btn.addEventListener('click', () => {
          btn.blur();
          setLength(o.v);
          closeModal(topicsModal);   // same as picking a category
          showMessage(o.v === 'any' ? 'Any length' : o.v + '-letter words');
        });
        wrap.appendChild(btn);
      });

      if (lengthFilter === 'any') {
        note.textContent = 'Words come at random from every length.';
      } else {
        const all = WORDS[currentTopic].filter(w => w.length === lengthFilter);
        const got = foundFor(currentTopic).filter(w => w.length === lengthFilter).length;
        note.textContent = lengthFilter + '-letter words only — ' + got + ' of ' +
                           all.length + ' found in ' + topicMeta(currentTopic).label + '.';
      }
    }

    // ---------- Category picker ----------
    function renderTopics() {
      const wrap = document.getElementById('topics-grid');
      wrap.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const found = foundFor(cat.id).length;
        const total = WORDS[cat.id].length;
        const complete = found === total;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cat-btn' +
          (cat.id === currentTopic ? ' active' : '') +
          (complete ? ' done' : '');

        const icon = document.createElement('span');
        icon.className = 'cat-icon';
        icon.textContent = cat.icon;

        const text = document.createElement('span');
        text.className = 'cat-text';
        const name = document.createElement('span');
        name.className = 'cat-name';
        name.textContent = cat.label;
        const hint = document.createElement('span');
        hint.className = 'cat-hint';
        hint.textContent = cat.hint;
        const prog = document.createElement('span');
        prog.className = 'cat-prog';
        prog.textContent = complete ? '★ all ' + total + ' found' : found + '/' + total + ' found';
        text.appendChild(name);
        text.appendChild(hint);
        text.appendChild(prog);

        btn.appendChild(icon);
        btn.appendChild(text);
        btn.addEventListener('click', () => { setTopic(cat.id); closeModal(topicsModal); });
        wrap.appendChild(btn);
      });
    }

    // ---------- Found words ----------
    function renderFound() {
      const wrap = document.getElementById('found-grid');
      wrap.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const list = foundFor(cat.id);
        const all = WORDS[cat.id];
        const complete = list.length === all.length;
        const sec = document.createElement('div');
        sec.className = 'found-section' + (cat.id === currentTopic ? ' current' : '');

        const head = document.createElement('div');
        head.className = 'found-head';
        const title = document.createElement('span');
        title.textContent = cat.icon + ' ' + cat.label;
        const count = document.createElement('span');
        count.className = 'found-count' + (complete ? ' done' : '');
        count.textContent = list.length + '/' + all.length;
        head.appendChild(title);
        head.appendChild(count);
        sec.appendChild(head);

        // Grouped by length, so unfound words also show how long they are.
        const lengths = [];
        all.forEach(w => { if (lengths.indexOf(w.length) === -1) lengths.push(w.length); });
        lengths.sort((a, b) => a - b);

        lengths.forEach(len => {
          const group = document.createElement('div');
          group.className = 'len-group';
          const tag = document.createElement('span');
          tag.className = 'len-tag';
          tag.textContent = len;
          const chips = document.createElement('div');
          chips.className = 'chips';
          all.filter(w => w.length === len).forEach(w => {
            const got = list.indexOf(w) !== -1;
            const chip = document.createElement('span');
            chip.className = 'chip ' + (got ? 'got' : 'locked');
            chip.textContent = got ? w : '•'.repeat(len);
            chips.appendChild(chip);
          });
          group.appendChild(tag);
          group.appendChild(chips);
          sec.appendChild(group);
        });

        wrap.appendChild(sec);
      });
    }

    // ---------- Stats ----------
    // The same card serves the global totals and any one category; the pill row
    // at the top switches which block is on show.
    function renderStatsScope() {
      const wrap = document.getElementById('stats-scope-grid');
      wrap.innerHTML = '';
      applyCols(wrap, CATEGORIES.length);

      const all = document.createElement('button');
      all.type = 'button';
      all.className = 'pick wide' + (statsView === 'all' ? ' on' : '');
      all.textContent = 'All';
      all.setAttribute('aria-pressed', String(statsView === 'all'));
      all.addEventListener('click', () => { all.blur(); statsView = 'all'; renderStats(); });
      wrap.appendChild(all);

      CATEGORIES.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pick' + (statsView === cat.id ? ' on' : '');
        btn.textContent = cat.icon;
        btn.setAttribute('aria-label', cat.label + ' statistics');
        btn.setAttribute('aria-pressed', String(statsView === cat.id));
        btn.addEventListener('click', () => { btn.blur(); statsView = cat.id; renderStats(); });
        wrap.appendChild(btn);
      });
    }

    function renderStats() {
      const s = loadStats();
      const scoped = statsView === 'all' ? s : statsFor(s, statsView);

      renderStatsScope();

      const label = document.getElementById('stats-scope-label');
      if (statsView === 'all') {
        label.textContent = 'Every category';
      } else {
        const cat = topicMeta(statsView);
        label.textContent = cat.label + ' — ' + foundFor(cat.id).length + '/' +
                            WORDS[cat.id].length + ' words found';
      }

      const winPct = scoped.played > 0
        ? Math.max(0, Math.min(100, Math.round((scoped.won / scoped.played) * 100)))
        : 0;
      document.getElementById('stat-played').textContent = scoped.played;
      document.getElementById('stat-winpct').textContent = winPct;
      document.getElementById('stat-cur').textContent    = scoped.currentStreak;
      document.getElementById('stat-max').textContent    = scoped.maxStreak;

      const distEl = document.getElementById('distribution');
      distEl.innerHTML = '';
      const max = Math.max(1, ...scoped.distribution);
      // Normally DIST_BUCKETS rows, but show more if an older save recorded
      // wins beyond that so no result is hidden.
      let rows = DIST_BUCKETS;
      for (let i = scoped.distribution.length - 1; i >= rows; i--) {
        if (scoped.distribution[i] > 0) { rows = i + 1; break; }
      }
      for (let i = 0; i < rows; i++) {
        const row = document.createElement('div');
        row.className = 'dist-row';
        const rowLabel = document.createElement('div');
        rowLabel.textContent = String(i + 1);
        const bar = document.createElement('div');
        // lastWinRow is stored inside each block, so it already refers to
        // whichever scope is on show — no need to check the current category.
        bar.className = 'dist-bar' + (i === scoped.lastWinRow ? ' highlight' : '');
        const count = scoped.distribution[i];
        bar.style.width = Math.max(8, (count / max) * 100) + '%';
        bar.textContent = String(count);
        row.appendChild(rowLabel);
        row.appendChild(bar);
        distEl.appendChild(row);
      }

      const noGames = scoped.played === 0;
      const empty = document.getElementById('stats-empty');
      empty.textContent = STORAGE_OK
        ? 'No games here yet.'
        : 'No games here yet — and this page can’t save progress.';
      empty.hidden = !noGames;
      document.getElementById('dist-head').hidden = noGames;
      distEl.hidden = noGames;
      shareBtn.disabled = !lastShareText;
    }

    // ---------- Modal helpers ----------
    // A dialog needs the rest of the page taken out of the tab order, or Tab
    // walks straight out of it into the 40-odd buttons behind — and focus has
    // to land inside the dialog for it to be announced at all. `inert` does
    // both in current browsers and is a harmless no-op in older ones.
    const gameEl = document.querySelector('main.game');
    let focusBeforeModal = null;

    function setBackgroundInert(on) {
      [gameEl, winOverlay, propLayer].forEach(el => {
        if (!el) return;
        if (on) el.setAttribute('inert', '');
        else el.removeAttribute('inert');
      });
    }

    // `trigger` is passed explicitly because the click handlers blur the button
    // first (to shed the sticky focus ring on touch), which would otherwise
    // leave document.activeElement as <body> and lose the return target.
    function openModal(modal, trigger) {
      focusBeforeModal = trigger ||
        (document.activeElement === document.body ? null : document.activeElement);
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      setBackgroundInert(true);
      const card = modal.querySelector('.modal-card');
      if (card && card.focus) { try { card.focus(); } catch (_) {} }
    }

    function closeModal(modal) {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      if (anyModalOpen()) return;
      setBackgroundInert(false);
      // The length chip is rebuilt on every new word, so the captured node may
      // be detached by now; only refocus something still on the page.
      if (focusBeforeModal && focusBeforeModal.focus && document.contains(focusBeforeModal)) {
        try { focusBeforeModal.focus(); } catch (_) {}
      }
      focusBeforeModal = null;
    }
    function anyModalOpen() {
      return topicsModal.classList.contains('active') ||
             foundModal.classList.contains('active') ||
             statsModal.classList.contains('active');
    }

    // ---------- Wiring ----------
    // Show first, then fill: the pill grids size themselves from the measured
    // width, and a display:none modal measures zero.
    function openTopics(trigger) { openModal(topicsModal, trigger); renderTopics(); renderLengths(); }
    function openStats(trigger)  { openModal(statsModal, trigger); renderStats(); }
    function openFound(trigger)  { openModal(foundModal, trigger); renderFound(); }

    retryBtn.addEventListener('click', () => {
      retryBtn.blur();
      if (busy()) return;          // let the reveal finish and be counted
      clearCurrentAnswer();
      reset();
    });
    themeBtn.addEventListener('click', () => { themeBtn.blur(); setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); });
    topicsBtn.addEventListener('click', () => { topicsBtn.blur(); openTopics(topicsBtn); });
    foundBtn.addEventListener('click',  () => { foundBtn.blur(); openFound(foundBtn); });
    statsBtn.addEventListener('click',  () => { statsBtn.blur(); openStats(statsBtn); });
    shareBtn.addEventListener('click',  share);

    document.querySelectorAll('[data-close]').forEach(el => {
      el.addEventListener('click', () => closeModal(document.getElementById(el.dataset.close)));
    });

    // Rotating the phone changes how many pills fit per row; re-lay out
    // whichever sheet is open so the grid never goes stale.
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (topicsModal.classList.contains('active')) { renderTopics(); renderLengths(); }
        if (statsModal.classList.contains('active')) renderStats();
      }, 120);
    });

    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (anyModalOpen()) {
        if (e.key === 'Escape') {
          e.preventDefault();
          [topicsModal, foundModal, statsModal].forEach(m => closeModal(m));
        }
        return;
      }
      if (e.key === 'Enter')     { e.preventDefault(); return handleKey('ENTER'); }
      if (e.key === 'Backspace') { e.preventDefault(); return handleKey('BACK'); }
      const k = (e.key || '').toUpperCase();
      if (/^[A-Z]$/.test(k)) handleKey(k);
    });

    reset();
  })();
  </script>
</body>
</html>
